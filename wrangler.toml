# Cloudflare Pages Configuration for AIPUSULA
# Reference: https://developers.cloudflare.com/pages/configuration/

name = "aipusula-report"
compatibility_date = "2026-07-25"
pages_build_output_dir = "dist/public"

[build]
  command = "pnpm install && pnpm run build"
  build_caching = true
  environment_variables = { DEPLOY_TARGET = "cloudflare", NODE_ENV = "production" }

[build.upload]
  format = "static"

# SPA fallback - serve index.html for all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable assets (JS, CSS with fingerprinted filenames) for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache manus internal assets for 1 hour
[[headers]]
  for = "/__manus__/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# No-cache for HTML pages (always get latest)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

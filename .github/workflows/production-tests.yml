name: production-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deterministic install is intentionally enforced with the committed lockfile.

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - name: Start production server
        run: |
          NODE_ENV=production PORT=3000 node dist/index.js > /tmp/aipusula-report.log 2>&1 &
          echo $! > /tmp/aipusula-report.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aipusula-report.log
          exit 1
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/aipusula-report.pid ]; then kill $(cat /tmp/aipusula-report.pid) || true; fi

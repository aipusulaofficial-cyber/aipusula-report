name: Portfolio Coverage Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.18.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add -D @vitest/coverage-v8@2.1.4 --ignore-scripts
      - name: Run tests with coverage
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary
          coverage_file="$(find . -type f -path '*/coverage/coverage-summary.json' -print -quit)"
          if [ -z "$coverage_file" ]; then
            echo "coverage-summary.json was not generated"
            find . -type f -name 'coverage-summary.json' -print
            exit 1
          fi
          cp "$coverage_file" artifacts/coverage-summary.json
          test -s artifacts/coverage-summary.json
      - name: Validate coverage evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/coverage-summary.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          total = data.get("total", {})
          required = ("lines", "statements", "functions", "branches")
          missing = [key for key in required if key not in total]
          if missing:
              raise SystemExit(f"coverage evidence missing metrics: {missing}")
          summary = {
              key: total[key]["pct"]
              for key in required
          }
          Path("artifacts/coverage-evidence.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(summary)
          PY
      - name: Upload portfolio coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-coverage-evidence
          path: artifacts/
          if-no-files-found: error
